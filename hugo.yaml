          aboutUs: |
            The London Network Automation Meetup (LNAM) is a volunteer-run meetup focused on hosting periodic meetups in London focused around network automation.

            ## History

            The London Network Automation Meetup was first organized in 2017 by [Csilla Bessenyei](https://www.linkedin.com/in/csilla-bessenyei-4114663b/) and had 14 meetups before taking a hiatus in 2022.

            A new team of volunteers has resurrected the meetup in 2025.

            ## Organisers

            The London Network Automation Meetup is a volunteer-run meetup and organised by:

            - [Pete Crocker](https://www.linkedin.com/in/petercrocker/)
            - [David Gee](https://www.linkedin.com/in/davedotdev/)
          directions: |
            Civo Tech Junction is at 32-37 Cowper Street in Shoreditch, just south of the Old Street roundabout.

            **From Old Street Station** (Northern line and Great Northern trains, closest, ~3 min walk):
            From the roundabout, walk south down City Road towards Moorgate. Cowper Street is the first turning on your left, about 100 m from the roundabout.

            **From Moorgate Station** (Northern, Circle, Hammersmith & City and Metropolitan lines, ~13 min walk):
            Take the Moorfields exit, turn right onto Ropemaker Street, then left onto City Road. Walk north past Finsbury Square and turn right onto Cowper Street.

            **From Liverpool Street Station** (Elizabeth and Central lines and mainline trains, ~17 min walk):
            Walk west through Broadgate to Finsbury Square, then north up City Road and turn right onto Cowper Street.

            **Parking, bikes and step-free access:**
            There is no parking at the venue. Bike parking and public car parks are nearby. The venue has step-free access and a passenger lift.


